# agentdesk.conf — minimal standalone Hyprland for the nested agent desktop.
#
# Deliberately does NOT source ~/.config/hypr/*. The ii-overlay rice starts
# quickshell, which binds /run/user/1000/quickshell and would collide with the
# real session. The agent desktop wants a bare compositor, not the rice.
#
# The output size is set by the parent compositor (the nested window's size),
# so the monitor line below is mostly a formality.

monitor = , preferred, 0x0, 1

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    disable_autoreload = true
}

animations {
    enabled = false
}

decoration {
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

general {
    gaps_in = 2
    gaps_out = 4
    border_size = 1
}

# Enough keybinds that a human who opens the window to inspect it isn't
# stranded without a way to close a window or quit.
$mod = SUPER
bind = $mod, Q, killactive
bind = $mod, RETURN, exec, kitty
bind = $mod SHIFT, E, exit

debug {
    disable_logs = false
}
